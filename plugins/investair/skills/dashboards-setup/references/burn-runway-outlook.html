
<title>Burn and Runway Outlook</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap">
<style>
/* Layout: slim navy masthead, then one column: chart (lead), adjustable drivers, the read. Investair brand, single light look.
   Navy = Investair v1 line, amber = range and the viewer's own estimate. */
:root{
  color-scheme: light;
  --navy:#0a2342; --amber:#e8760a; --teal:#1a7f8e; --danger:#c2410c; --focus:#ff6b35;
  --page:#f6f7f9; --surface:#ffffff; --tint:#f1f4f8;
  --ink:#0a2342; --body:#4a5568; --muted:#64748b; --on-navy:#d1d5db; --on-navy-muted:#9ca3af;
  --line:#e2e8f0; --card:#e5e7eb;
  --amber-tint:rgba(232,118,10,.18); --teal-tint:rgba(26,127,142,.12); --danger-tint:rgba(194,65,12,.1);
  --f-display:Montserrat,"Helvetica Neue",Arial,sans-serif; --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--body);font-family:var(--f-body);font-size:15px;line-height:1.5}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}

.top{background:var(--navy);color:var(--on-navy);padding-inline:16px;padding-block:14px}
.top .in{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:30px;width:auto;display:block}
.brand h1{margin:0;font:700 19px/1.2 var(--f-display);color:#fff;text-wrap:balance}
.asof{font:500 12.5px/16px var(--f-body);color:var(--on-navy-muted)}

.page{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:18px 40px;display:flex;flex-direction:column;gap:22px}

/* company bar */
.cobar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:700 14px/20px var(--f-display);letter-spacing:.02em;padding:6px 12px;border-radius:6px;border:1px solid var(--card);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--amber)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.chip .ex{font:600 10px/14px var(--f-body);text-transform:uppercase;letter-spacing:.06em;opacity:.75}
.add{display:inline-flex;gap:6px;margin-left:auto}
.add input{font:700 14px/20px var(--f-body);padding:6px 10px;width:7.5rem;border:1px solid var(--card);border-radius:6px;background:var(--surface);color:var(--ink);text-transform:uppercase}
.add input::placeholder{text-transform:none;font-weight:500;color:var(--muted)}
.btn{font:600 13px/18px var(--f-body);padding:7px 12px;border-radius:6px;border:1px solid var(--card);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--amber)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.link{border:0;background:none;padding:4px 2px;color:var(--muted);text-decoration:underline;font-weight:500}
.status{margin:-12px 0 0;min-height:0;font-size:13.5px;color:var(--ink)}
.status:empty{display:none}
.status.err{background:var(--danger-tint);border:1px solid var(--danger);border-radius:6px;padding:8px 12px}
.busy{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:spin 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.busy{animation:none}}

/* sections */
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h2{margin:0;font:700 13px/18px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.sec-h .meta{font-size:12.5px;color:var(--muted)}
.co-name{font:700 22px/1.25 var(--f-display);color:var(--ink);margin:0;text-wrap:balance}

/* chart */
.chart{background:var(--surface);border:1px solid var(--card);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 18px}
.key{display:flex;flex-direction:column;gap:2px;min-width:0;padding-left:12px;border-left:3px solid var(--line)}
.key.k-inv{border-left-color:var(--navy)}
.key.k-you{border-left-color:var(--amber)}
.key.k-rng{border-left-color:var(--amber-tint)}
.key .l{font:600 11px/14px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.key .v{font:700 22px/28px var(--f-body);color:var(--ink);font-variant-numeric:tabular-nums}
.key .s{font-size:12.5px;line-height:17px;color:var(--muted)}
.plot{position:relative;overflow-x:auto}
.plot svg{display:block;min-width:640px;width:100%;height:auto}
.tip{position:absolute;z-index:5;pointer-events:none;max-width:290px;background:var(--surface);border:1px solid var(--card);border-radius:6px;box-shadow:0 8px 20px -6px rgba(10,35,66,.25);padding:9px 11px;font-size:12.5px;line-height:18px;color:var(--body)}
.tip .h{font:700 13px/16px var(--f-display);color:var(--ink);margin-bottom:5px}
.tip .r{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.tip .r b{color:var(--ink)}
.tip .t{color:var(--ink);font-weight:500;margin-bottom:4px}
@media (max-width:640px){.keys{grid-template-columns:minmax(0,1fr)}.key .v{font-size:19px;line-height:24px}}

/* drivers */
.moves{background:var(--surface);border:1px solid var(--card);border-radius:10px;overflow:hidden}
.mv{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 12px;padding:14px 16px;border-top:1px solid var(--line)}
.mv:first-child{border-top:0}
.mv.off .body{opacity:.45}
.num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 11.5px/1 var(--f-body);color:#fff;background:var(--teal);margin-top:2px}
.num.neg{background:var(--danger)}
.body{display:flex;flex-direction:column;gap:6px;min-width:0}
.mv-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.mv-t{font-size:14.5px;line-height:21px;color:var(--ink);font-weight:500;max-width:70ch}
.mv-src{font-size:12px;color:var(--muted)}
.cat{font:600 10.5px/14px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.use{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);white-space:nowrap}
.slide{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.slide .end{font-size:12px;line-height:16px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.slide .end b{display:block;font-weight:600;color:var(--body)}
.slide .end.r{text-align:right}
input[type=range]{width:100%;accent-color:var(--amber);margin:0}
.val{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.val b{font-weight:700}
.pill{font:600 11px/15px var(--f-body);padding:2px 8px;border-radius:999px;border:1px solid var(--card);background:var(--tint);color:var(--ink);white-space:nowrap}
.pill.disclosed{background:var(--teal-tint);border-color:var(--teal)}
.pill.inferred{background:var(--amber-tint);border-color:var(--amber)}
.moves-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:var(--tint);border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.empty{padding:18px 16px;font-size:14px;color:var(--body)}
@media (max-width:560px){.slide{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.slide input{grid-column:1/-1;grid-row:1}.slide .end.r{grid-column:2}}

/* the read */
.read{background:var(--surface);border:1px solid var(--card);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.read p{margin:0;color:var(--ink);font-size:15px;line-height:23px;max-width:72ch}
.read .lbl{font:600 11px/14px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.read ul{margin:0;padding-left:18px;font-size:14px;line-height:21px;color:var(--body);max-width:72ch;display:flex;flex-direction:column;gap:4px}
.read .co{font-size:14px;line-height:21px;color:var(--body);max-width:72ch}
.legal{font-size:12px;line-height:18px;color:var(--muted);max-width:84ch;margin:0}
</style>

async function pullSnapshot(tk) {
  const r = await mcp.callTool(SERVER, "get_cashflow_snapshot", { asx_code: tk, user_question: "Burn and Runway Outlook: " + tk });
  const p = unwrap(r);
  if (!p || !p.found || !p.snapshot) throw { code: "not_found" };
  if (p.identity && p.identity.listing_status && p.identity.listing_status !== "listed") throw { code: "not_live", detail: p.identity.listing_status };
  const s = p.snapshot, n = x => (x == null || x === "") ? null : Number(x);
  const out = Math.abs(n(s.total_relevant_outgoings_aud) || 0), q = n(s.adjusted_estimated_quarters_funding), cash = n(s.adjusted_cash_today_aud) || 0, fac = n(s.unused_finance_facilities_aud) || 0;

    snap: { asOf: String(s.report_date).slice(0, 10), baseQE: String(s.base_quarter_end).slice(0, 10), cash, funding, daily: n(s.daily_cash_flow_aud) || 0, qEst: q, outQ: out, postQE: s.post_quarter_cash_events_summary || null, cashWatch: cw.map(x => x.flag || x).filter(Boolean) }
  };
}

  try {
    const r = await mcp.callTool(SERVER, "run_readonly_sql", { sql, user_question: "Burn and Runway Outlook, section 8 answers: " + tk });

    const o = { docType: String(x.document_type || ""), qe, outlook: clean(x.outlook), steps: clean(x.steps), cont: clean(x.cont), extrapolationRisk: Number(x.xr) === 1, posTrans: clean(x.pos_trans), selfFunded: clean(x.self_funded), accrued: clean(x.accrued) };

const NOISE = /escrow|restricted (shares|securities)|quotation|substantial holder|issues? (of )?(new )?(ordinary )?(shares|securities)|new ordinary shares|cessation|cancell?ation|performance rights|appendix 2a|appendix 3[a-z]|director'?s? interest|top 20|governance|appendix 4g|(notice|results) of (annual |general |special )?(general )?meeting|registered office|share registry/i;

async function pullAnnouncements(tk, fromDate) {

async function addBodies(tk, kept, baseQE) {

/* ---------- Claude estimate ---------- */
const RULES = `You are an Investair analyst. Investair's Cashflow.cashflow_daily projection is recalculated every day from the company's latest filed quarterly cash flow report (4C or 5B): it extends that quarter's net operating outflow as a flat daily burn and already includes post-quarter raises, option exercises, R&D rebates, grants and facilities. It does NOT read announcements, so it misses changes in costs or revenue that start after the quarter ended.

Your job: read the announcements supplied (Investair's summaries from Feed_Public.feed_new, full content where given, otherwise the short preview) and decide whether the company's costs or revenue will differ from what the latest quarterly implies. If they will, say why and estimate the effect as a range. The page draws your range as a band pinned to the cashflow_daily line. If nothing changes the outlook, say so and return no events.

Start with the SECTION 8 ANSWERS if supplied. They are the company's own guidance on next quarter's burn and outrank anything you infer:
- "Will net operating cash flow continue at this level": if not, build events from the reasons given (one-off items in the base quarter, programmes ending, cost cuts, receipts expected). If it says similar, add no change you cannot tie to a statement.
- "Steps to raise cash": never count raise proceeds (Investair adds them). Flag whether a raise is planned. An expected upfront or licence payment is a "one_off_in" event.
- "Can it continue operations": going-concern or uncertainty language is a flag.
- Term deposits the quarterly holds outside cash (item 8.4) are not in Investair's cash: add them as a "baseline_correction" one-off, confidence "disclosed".
- If the company quotes a cash reach date, check your events imply a similar monthly burn; if not, say why in "basis".
- "Yes", "No" or "N/A" alone carries no information.

Check the base quarter for one-offs before treating it as the run-rate: a rebate, grant, insurance or legal receipt, or a one-off payment such as a repayment or acquisition cost. Each is a "baseline_correction" (monthlyLow = monthlyHigh = the one-off divided by 3, starting the day after quarter end). Add back a further rebate only if the company flags one.

What counts: programmes that start, stop, wind down or change scale (trials, trial arms or sites, drilling, studies, construction, manufacturing, launches, restructures, headcount, leases, equipment); revenue changes (contracts, distribution deals, launches, pricing, lost customers, milestone or licence payments); one-off cash items not yet in Investair (settlements, close-out or termination costs, acquisition payments, expected tax or grant receipts); and the quarterly's own forward statements on spend. A programme paused or scaled back matters as much as one added.
What does not count: the base quarter's own spending; placements, SPPs, rights issues, option exercises, note draws and receipts Investair already includes; share issues, governance, investor presentations. Items dated before quarter end count only if their effect starts after it. If a raise has been announced (Appendix 3B, cleansing notice) but is not in Investair yet, say so in "flags"; do not model it.

Sizing: AUD whole dollars. Positive improves cash, negative worsens it. monthlyLow is the pessimistic monthly effect and monthlyHigh the optimistic one; oneOffLow and oneOffHigh are a lump sum on "start" (0 if none); "end" is null if ongoing; rampMonths is months to full effect. Convert foreign currency and say so. Company figure given: use it, confidence "disclosed". Direction only: size from the quarter's cost lines and the existing programme's scale, "inferred". Guessing size or timing: "speculative". Every event traces to an announcement title and date. Don't double count; the combined improvement never exceeds the base burn. Skip items under about 3% of monthly burn. At most 10 events, most material first.

Keep the reply simple and say each thing once. "headline" gives the direction against the cashflow_daily line and the main uncertainty. "section8.reading" says only how the company's guidance was used. "basis" gives the working, not a repeat of "text". "companyFigure" holds only what the company itself stated; never present your estimate as the company's. "flags" (at most 4) cover funding risks outside cost and revenue: facility availability, suspension, going concern, covenants, an announced raise. "ignored" lists up to 5 screened-out items in under 15 words each. Plain sentences, no dashes as asides.`;
const SHAPE = `Reply with ONLY JSON: {"headline": string (2 sentences: which way the announcements push the burn versus Investair's flat run-rate, and what the main uncertainty is), "quarterlyGuidance": string (what the quarterly itself said about future spend, or "The quarterly gave no spend guidance."), "events": [{"date": "YYYY-MM-DD" (announcement date), "title": string (announcement title), "category": "cost_up"|"cost_down"|"revenue_up"|"revenue_down"|"one_off_in"|"one_off_out"|"baseline_correction", "text": string (under 30 words: what the company said and what it changes), "start": "YYYY-MM-DD", "end": "YYYY-MM-DD"|null, "rampMonths": number, "monthlyLow": number, "monthlyHigh": number, "oneOffLow": number, "oneOffHigh": number, "confidence": "disclosed"|"inferred"|"speculative", "companyFigure": string (the exact figure or quote the company itself gave for this item, with where it said it, or "" if the company gave no number; never put your own estimate here), "basis": string (under 40 words: the working behind the range)}], "flags": [string], "ignored": [string], "section8": {"signal": "lower"|"similar"|"higher"|"unclear" (does the company expect the coming quarter's burn to be lower, similar or higher than the base quarter), "reading": string (2 sentences: what the company says about next quarter's burn and how you used it, or "No section 8 answers are recorded for this quarterly." if none), "companyView": string (under 30 words, the company's own statement of its burn outlook or cash reach, quoted closely, or "No spend or cash reach guidance given.")}}`;

function cleanEvent(e, i, baseQE) {
  const n = v => { v = Number(v); return isFinite(v) ? v : 0; };
  const re = /^\d{4}-\d\d-\d\d$/;
  let mLo = n(e.monthlyLow), mHi = n(e.monthlyHigh); if (mLo > mHi) [mLo, mHi] = [mHi, mLo];
  let oLo = n(e.oneOffLow), oHi = n(e.oneOffHigh); if (oLo > oHi) [oLo, oHi] = [oHi, oLo];
  let start = re.test(e.start) ? e.start : (re.test(e.date) ? e.date : baseQE);
  const minStart = iso(D(baseQE) + DAY); if (start < minStart) start = minStart;
  const end = re.test(e.end) && e.end > start ? e.end : null;
  return { id: "e" + (i + 1), date: re.test(e.date) ? e.date : start, title: String(e.title || ""), category: CAT[e.category] ? e.category : "cost_up", text: String(e.text || ""), start, end, ramp: Math.min(12, Math.max(0, n(e.rampMonths))), mLo, mHi, oLo, oHi, confidence: CONF[e.confidence] ? e.confidence : "inferred", basis: String(e.basis || ""), companyFigure: String(e.companyFigure || "") };
}

async function analyse(tk) {

  const { total, kept } = await pullAnnouncements(tk, from);
  if (!kept.length) { status(`${tk}: no announcements found since ${fmtD(from)}, so there is nothing to adjust the Investair estimate with.`, true); }
  const nFull = await addBodies(tk, kept, base.snap.baseQE);

  status(`<span class="busy"></span>${tk}: Claude is sizing the cost and revenue changes (about a minute)…`);
  const out = await sample.json(prompt, { modelTier: "default", cache: false });

    .filter(e => e.mLo || e.mHi || e.oLo || e.oHi);
  const doc = {
    ticker: tk, name: base.name, sector: base.sector, stage: base.stage,

    window: { from, to: today(), reviewed: total, read: items.length },
    analysis: {
      headline: String((out && out.headline) || ""), quarterlyGuidance: String((out && out.quarterlyGuidance) || ""),
      events, flags: ((out && out.flags) || []).slice(0, 4).map(String), ignored: ((out && out.ignored) || []).slice(0, 5).map(String),
      s8Signal: ['lower', 'similar', 'higher', 'unclear'].includes(out && out.section8 && out.section8.signal) ? out.section8.signal : 'unclear', s8Reading: String((out && out.section8 && out.section8.reading) || ''), s8CompanyView: String((out && out.section8 && out.section8.companyView) || '')

async function updateNumbers(tk) {

try { pos = JSON.parse(localStorage.getItem("runway-sliders") || "{}") || {}; } catch { pos = {}; }
try { JSON.parse(localStorage.getItem("runway-off") || "[]").forEach(k => off.add(k)); } catch {}

const tOf = (c, e) => { const v = pos[c.ticker + ":" + e.id]; return v == null ? 0.5 : v; };
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- model ---------- */
function model(c) {
  const s = c.snap, evs = ((c.analysis && c.analysis.events) || []).filter(e => !off.has(c.ticker + ":" + e.id));
  const t0 = D(s.asOf), kQE = Math.round((D(s.baseQE) - t0) / DAY);
  const fund = s.funding;
  const ev = evs.map(e => ({ ...e, t: tOf(c, e), ks: Math.round((D(e.start) - t0) / DAY), ke: e.end ? Math.round((D(e.end) - t0) / DAY) : Infinity }));
  const inv = k => fund + s.daily * k;
  const cum = (e, k, t) => {
    if (k < e.ks) return 0;
    const x = Math.max(0, Math.min(k, e.ke) - e.ks), R = e.ramp * 30.4, md = lerp(e.mLo, e.mHi, t) * 12 / 365;
    const m = R <= 0 ? md * x : (x <= R ? md * x * x / (2 * R) : md * (x - R / 2));
    return m + lerp(e.oLo, e.oHi, t);
  };
  const adj = (k, t) => inv(k) + ev.reduce((a, e) => a + cum(e, k, t == null ? e.t : t), 0);
  const lo = k => adj(k, 0), hi = k => adj(k, 1), you = k => adj(k, null);
  const out = fn => { if (fn(0) <= 0) return 0; for (let k = 1; k <= 1825; k++) if (fn(k) <= 0) return k; return null; };
  return { s, ev, t0, kQE, inv, lo, hi, you, co: { inv: out(inv), lo: out(lo), hi: out(hi), you: out(you) } };
}
const current = () => { const src = companies.length ? companies : examples; return src.find(z => z.ticker === selected) || src[0] || null; };

/* ---------- chart ---------- */
function niceStep(max) { const raw = max / 5, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
const CW = 900, CL = 58, CR = 18;
function chart(c, M) {
  const W = CW, L = CL, R = CR, T = 16, yB = 300, H = M.ev.length ? 372 : 330;
  const ends = [M.co.inv, M.co.lo, M.co.hi, M.co.you].filter(v => v != null);
  const firstK = M.ev.length ? Math.min(...M.ev.map(e => e.ks)) : 0, kMin = Math.min(0, Math.max(M.kQE, firstK)), kMax = Math.min(600, Math.max(270, (ends.length ? Math.max(...ends) : 600) + 60));
  const step = Math.max(1, Math.round((kMax - kMin) / 260));
  let yMax = 0; for (let k = 0; k <= kMax; k += step) yMax = Math.max(yMax, M.inv(k), M.hi(k), M.lo(k));
  yMax = Math.max(yMax, 1e5) * 1.06;
  const ys = niceStep(yMax / 1e6) * 1e6, x = k => L + (k - kMin) / (kMax - kMin) * (W - L - R), y = v => yB - Math.max(v, 0) / yMax * (yB - T);
  const FONT = 'font-family="Inter,system-ui,sans-serif"';
  let g = "";
  if (kMin < 0) g += `<rect x="${x(kMin)}" y="${T}" width="${x(0) - x(kMin)}" height="${yB - T}" fill="var(--tint)"/>`;
  for (let v = 0; v <= yMax; v += ys) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(v) + 4}" font-size="10.5" fill="var(--muted)" text-anchor="end" ${FONT}>${v === 0 ? "0" : "A$" + +(v / 1e6).toFixed(2) + "m"}</text>`;
  const every = (kMax - kMin) > 330 ? 2 : 1;
  let d0 = new Date(M.t0 + kMin * DAY); d0 = Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + 1, 1);
  for (let i = 0, m = d0; m <= M.t0 + kMax * DAY; i++) {
    const dt = new Date(m); const k = Math.round((m - M.t0) / DAY);
    if (i % every === 0) g += `<line x1="${x(k)}" x2="${x(k)}" y1="${yB}" y2="${yB + 4}" stroke="var(--muted)"/><text x="${x(k)}" y="${yB + 17}" font-size="10.5" fill="var(--muted)" text-anchor="middle" ${FONT}>${dt.toLocaleDateString("en-AU", { month: "short", year: "2-digit", timeZone: "UTC" })}</text>`;
    m = Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth() + 1, 1);
  }
  const path = fn => { let d = "", on = false; for (let k = 0; k <= kMax; k += step) { const v = fn(k); if (v <= 0) { d += (on ? "L" : "M") + x(k).toFixed(1) + "," + y(0).toFixed(1); break; } d += (on ? "L" : "M") + x(k).toFixed(1) + "," + y(v).toFixed(1); on = true; } return d; };
  if (M.ev.length) {
    let up = [], kStop = kMax;
    for (let k = 0; k <= kMax; k += step) { const v = M.hi(k); up.push(x(k).toFixed(1) + "," + y(v).toFixed(1)); if (v <= 0) { kStop = k; break; } }
    let dn = []; for (let k = kStop; k >= 0; k -= step) dn.push(x(k).toFixed(1) + "," + y(M.lo(k)).toFixed(1));
    g += `<polygon points="${up.concat(dn).join(" ")}" fill="var(--amber-tint)"/>`;
  }
  g += `<path d="${path(M.inv)}" fill="none" stroke="var(--navy)" stroke-width="2.5" stroke-linecap="round"${M.ev.length ? ' stroke-dasharray="2 5"' : ""}/>`;
  if (M.ev.length) g += `<path d="${path(M.you)}" fill="none" stroke="var(--amber)" stroke-width="3.5" stroke-linecap="round"/>`;
  g += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)"/>`;
  [["inv", "var(--navy)", "Investair v1 cash-out"], ["you", "var(--amber)", "Your estimate cash-out"]].forEach(([k, col, lbl]) => { const v = M.co[k]; if (v != null && v >= kMin && v <= kMax && (k === "inv" || M.ev.length)) g += `<circle cx="${x(v)}" cy="${y(0)}" r="6" fill="${col}" stroke="var(--surface)" stroke-width="2"><title>${lbl}: ${coDate(M, v)}</title></circle>`; });
  g += `<text x="${L}" y="11" font-size="10.5" font-weight="600" fill="var(--muted)" ${FONT}>Cash and undrawn facilities remaining (A$)</text>`;
  g += `<line x1="${x(0)}" x2="${x(0)}" y1="${T}" y2="${yB}" stroke="var(--navy)" stroke-width="1"/><text x="${x(0) + 5}" y="${T + 11}" font-size="10.5" font-weight="600" fill="var(--ink)" ${FONT}>Today</text>`;
  const nq = new Date(D(c.snap.baseQE)); nq.setUTCMonth(nq.getUTCMonth() + 3); const kn = Math.round((nq.getTime() + 28 * DAY - M.t0) / DAY);
  if (kn > 0 && kn < kMax) g += `<line x1="${x(kn)}" x2="${x(kn)}" y1="${T}" y2="${yB}" stroke="var(--muted)" stroke-dasharray="3 4"/><text x="${x(kn) + 5}" y="${T + 25}" font-size="10.5" fill="var(--muted)" ${FONT}>Next quarterly due</text>`;
  if (M.ev.length) {
    const all = c.analysis.events || [], lastX = [-99, -99];
    M.ev.map((e, i) => ({ e, i, cx: x(Math.min(Math.max(e.ks, kMin), kMax)) })).sort((a, b) => a.cx - b.cx).forEach(({ e, i, cx }) => {
      let row = lastX.findIndex(v => cx - v >= 22); if (row < 0) row = 0; lastX[row] = cx;
      const cy = yB + 40 + row * 20, good = lerp(e.mLo, e.mHi, e.t) * 12 + lerp(e.oLo, e.oHi, e.t) >= 0;
      g += `<g class="evm" data-i="${i}" tabindex="0" style="cursor:pointer"><circle cx="${cx}" cy="${cy}" r="9" fill="${good ? "var(--teal)" : "var(--danger)"}" stroke="var(--surface)" stroke-width="1.5"/><text x="${cx}" y="${cy + 3.5}" font-size="10" font-weight="700" fill="#fff" text-anchor="middle" ${FONT}>${all.findIndex(z => z.id === e.id) + 1}</text></g>`;
    });
  }
  g += `<rect id="hit" x="${L}" y="${T}" width="${W - L - R}" height="${yB - T}" fill="transparent"/><line id="xh" x1="0" x2="0" y1="${T}" y2="${yB}" stroke="var(--ink)" stroke-width="1" visibility="hidden"/>`;
  return { svg: `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Funding remaining over time: Investair v1 line, the worst-to-best range, and your estimate">${g}</svg>`, kMin, kMax };
}
function wireChart(M, kMin, kMax) {
  const wrap = $("plot"), tip = $("tip"); if (!wrap || !tip) return;
  const svg = wrap.querySelector("svg"), hit = $("hit"), xh = $("xh"); if (!svg || !hit) return;
  const place = (cx, cy) => {
    const wr = wrap.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    let left = cx - wr.left + wrap.scrollLeft + 14, top = cy - wr.top + 12;
    if (left + w > wrap.scrollLeft + wrap.clientWidth - 8) left = cx - wr.left + wrap.scrollLeft - w - 14;
    if (left < wrap.scrollLeft + 4) left = wrap.scrollLeft + 4;
    if (top + h > wrap.clientHeight - 4) top = Math.max(4, cy - wr.top - h - 10);
    tip.style.left = left + "px"; tip.style.top = top + "px";
  };
  const hide = () => { tip.hidden = true; xh.setAttribute("visibility", "hidden"); };
  hit.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * CW;
    const k = Math.max(0, Math.round(kMin + (vx - CL) / (CW - CL - CR) * (kMax - kMin)));
    const px = CL + (k - kMin) / (kMax - kMin) * (CW - CL - CR);
    xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.setAttribute("visibility", "visible");
    const f = v => v <= 0 ? "cash out" : fmtM(v);
    tip.innerHTML = `<div class="h">${fmtD(iso(M.t0 + k * DAY))}</div><div class="r"><span>Investair v1</span><b>${f(M.inv(k))}</b></div>${M.ev.length ? `<div class="r"><span>Your estimate</span><b>${f(M.you(k))}</b></div><div class="r"><span>Worst case</span><b>${f(M.lo(k))}</b></div><div class="r"><span>Best case</span><b>${f(M.hi(k))}</b></div>` : ""}`;
    tip.hidden = false; place(e.clientX, e.clientY);
  });
  hit.addEventListener("pointerleave", hide);
  wrap.querySelectorAll(".evm").forEach(m => {
    const show = (cx, cy) => {
      const e = M.ev[+m.dataset.i]; if (!e) return; xh.setAttribute("visibility", "hidden");
      tip.innerHTML = `<div class="h">${esc(CAT[e.category])} · ${fmtD(e.start)}</div><div class="t">${esc(e.text)}</div><div class="r"><span>Your setting</span><b>${esc(effect(e, e.t))}</b></div>`;
      tip.hidden = false; place(cx, cy);
    };
    m.addEventListener("pointerenter", ev => show(ev.clientX, ev.clientY));
    m.addEventListener("pointerleave", hide);
    m.addEventListener("focus", () => { const r = m.getBoundingClientRect(); show(r.left + r.width / 2, r.top + r.height / 2); });
    m.addEventListener("blur", hide);
    m.addEventListener("click", () => { const row = document.querySelector(`.mv[data-id="${M.ev[+m.dataset.i].id}"]`); if (row) row.scrollIntoView({ behavior: "smooth", block: "center" }); });
  });
  wrap.addEventListener("scroll", hide, { passive: true });
}
const effect = (e, t) => {
  const m = Math.round(lerp(e.mLo, e.mHi, t)), o = Math.round(lerp(e.oLo, e.oHi, t)), p = [];
  if (e.mLo || e.mHi) p.push(m >= 0 ? fmtM(m) + " a month less burn" : fmtM(-m) + " a month more burn");
  if (e.oLo || e.oHi) p.push(o >= 0 ? fmtM(o) + " cash in, once" : fmtM(-o) + " cash out, once");
  return p.join(", ") || "no effect";
};
const runway = (M, k) => k == null ? "20+ quarters" : (k / 91.25).toFixed(1) + " quarters";

/* ---------- render ---------- */
function renderChart(c) {
  const M = model(c), ch = chart(c, M), has = M.ev.length > 0;
  $("keys").innerHTML = `<div class="key k-inv"><span class="l">Investair v1</span><span class="v">${runway(M, M.co.inv)}</span><span class="s">Last quarter repeated · cash out ${coDate(M, M.co.inv)}</span></div>`
    + (has ? `<div class="key k-you"><span class="l">Your estimate</span><span class="v">${runway(M, M.co.you)}</span><span class="s">Set by the sliders below · cash out ${coDate(M, M.co.you)}</span></div>
    <div class="key k-rng"><span class="l">Range, worst to best</span><span class="v">${M.co.lo == null ? "20+" : (M.co.lo / 91.25).toFixed(1)} to ${runway(M, M.co.hi)}</span><span class="s">${coDate(M, M.co.lo)} to ${coDate(M, M.co.hi)}</span></div>`
    : `<div class="key"><span class="l">Range</span><span class="v">None</span><span class="s">No announcements since the quarterly change costs or revenue, so v1 stands.</span></div>`);
  $("plot").innerHTML = ch.svg + `<div class="tip" id="tip" role="tooltip" hidden></div>`;
  wireChart(M, ch.kMin, ch.kMax);
}
function renderMoves(c) {
  const box = $("moves"), all = (c.analysis && c.analysis.events) || [];
  if (!all.length) { box.innerHTML = `<div class="empty">No announcements since the quarterly point to a change in costs or revenue that Investair has missed, so there is nothing to adjust.</div>`; return; }
  box.innerHTML = all.map((e, i) => {
    const k = c.ticker + ":" + e.id, on = !off.has(k), t = tOf(c, e), good = (e.mLo + e.mHi) / 2 * 12 + (e.oLo + e.oHi) / 2 >= 0, fixed = e.mLo === e.mHi && e.oLo === e.oHi;
    return `<div class="mv${on ? "" : " off"}" data-id="${esc(e.id)}"><span class="num${good ? "" : " neg"}">${i + 1}</span><div class="body">
      <div class="mv-top"><div><span class="cat">${esc(CAT[e.category])}</span><div class="mv-t">${esc(e.text)}</div><div class="mv-src">${esc(e.title)} · ${fmtD(e.date)}${e.companyFigure ? " · Company said: " + esc(e.companyFigure) : ""}</div></div>
        <label class="use"><input type="checkbox" class="inc" data-k="${esc(k)}" ${on ? "checked" : ""}> Count it</label></div>
      ${fixed ? "" : `<div class="slide"><span class="end"><b>&larr; Shorter runway</b>${esc(effect(e, 0))}</span><input type="range" min="0" max="100" step="1" value="${Math.round(t * 100)}" data-k="${esc(k)}" aria-label="Item ${i + 1}: slide right for a longer runway" ${on ? "" : "disabled"}><span class="end r"><b>Longer runway &rarr;</b>${esc(effect(e, 1))}</span></div>`}
      <div class="mv-top"><span class="val">${fixed ? "Fixed amount" : "Your setting"}: <b data-v="${esc(k)}">${esc(effect(e, t))}</b></span><span class="pill ${e.confidence}">${esc(CONF[e.confidence])}</span></div>
    </div></div>`;
  }).join("") + `<div class="moves-foot"><span>Sliders start in the middle of each range. Your settings are kept in this browser only.</span><button class="btn" id="reset" type="button">Reset all to middle</button></div>`;
  box.querySelectorAll("input[type=range]").forEach(r => r.oninput = () => {
    pos[r.dataset.k] = +r.value / 100; keep();
    const e = all.find(z => c.ticker + ":" + z.id === r.dataset.k), v = box.querySelector(`[data-v="${CSS.escape(r.dataset.k)}"]`);
    if (e && v) v.textContent = effect(e, pos[r.dataset.k]);
    renderChart(c);
  });
  box.querySelectorAll(".inc").forEach(cb => cb.onchange = () => { cb.checked ? off.delete(cb.dataset.k) : off.add(cb.dataset.k); keep(); renderMoves(c); renderChart(c); });
  $("reset").onclick = () => { all.forEach(e => delete pos[c.ticker + ":" + e.id]); keep(); renderMoves(c); renderChart(c); };
}
const KIND = { quarterly: "New quarterly", v1: "Investair v1", event: "Announcement", flag: "Funding risk" };
const seenOnce = new Set();
function renderRead(c) {
  const A = c.analysis || {}, s = c.snap, d = c.daily;
  const flags = (A.flags || []).concat((s.cashWatch || []).length ? [s.cashWatch.join(". ") + "."] : []);
  const chg = d && d.changed && (d.changes || []).length ? d.changes : [];
  $("read").innerHTML = `${A.headline ? `<p>${esc(A.headline)}</p>` : `<p>No reading of the announcements yet. Select Re-read announcements.</p>`}
    ${A.s8CompanyView ? `<div class="co"><span class="lbl">What the company says</span><br>${esc(A.s8CompanyView)}</div>` : ""}
    ${flags.length ? `<div><span class="lbl">Funding risks</span><ul>${flags.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>` : ""}
    ${chg.length ? `<div><span class="lbl">Daily check, ${esc(fmtD(String(d.checkedAt).slice(0, 10)))}</span><ul>${chg.map(x => `<li><b>${esc(KIND[x.kind] || "Change")}:</b> ${esc(x.text)}</li>`).join("")}</ul></div>` : ""}`;
  if (!c._ex && d && d.changed && !d.seen && db && uid && !seenOnce.has(c.ticker)) {
    seenOnce.add(c.ticker);
    db.doc(`data/users/${uid}/runway/items/${c.ticker}`).update({ daily: { ...d, seen: true } }).catch(() => {});
  }
}
function renderChips() {
  const list = companies.length ? companies : examples, cur = current();
  $("chips").innerHTML = list.map(c => `<button class="chip" type="button" data-tk="${esc(c.ticker)}" aria-pressed="${cur && cur.ticker === c.ticker}">${esc(c.ticker)}${c._ex ? ' <span class="ex">Example</span>' : ""}${c.daily && c.daily.changed && !c.daily.seen ? '<span class="dot" title="Changed since you last looked"></span>' : ""}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b => b.onclick = () => { selected = b.dataset.tk; render(); });
  $("addBtn").disabled = busy || companies.length >= MAX;
  $("tk").disabled = companies.length >= MAX;
  $("tk").placeholder = companies.length >= MAX ? "6 of 6 used" : "Add ASX code";
}
function render() {
  const all = companies.concat(companies.length ? [] : examples);
  const asof = all.map(c => c.snap && c.snap.asOf).filter(Boolean).sort().pop();
  $("asof").textContent = asof ? "Investair data to " + fmtD(asof) : "Investair data";
  renderChips();
  const c = current(), v = $("view");
  if (!c) { v.innerHTML = `<section class="sec"><div class="read"><p>No companies yet. Type an ASX code above and select Add. Each company takes about a minute to analyse.</p></div></section>`; return; }
  const s = c.snap;
  v.innerHTML = `<section class="sec" aria-labelledby="coTitle">
      <div class="sec-h"><h2 class="co-name" id="coTitle">${esc(c.ticker)} · ${esc(c.name)}</h2>
        <span class="meta">${c._ex ? "Example · " : ""}Base quarter ended ${fmtD(s.baseQE)}${c._ex ? "" : ` · <button class="btn link" id="upd" type="button">Update numbers</button> <button class="btn link" id="reread" type="button">Re-read announcements</button> <button class="btn link" id="rm" type="button">Remove</button>`}</span></div>
      <div class="chart"><div class="keys" id="keys"></div><div class="plot" id="plot"></div></div>
    </section>
    <section class="sec" aria-labelledby="mvTitle"><div class="sec-h"><h2 id="mvTitle">What moves the estimate</h2><span class="meta">Slide right for more cash and a longer runway</span></div><div class="moves" id="moves"></div></section>
    <section class="sec" aria-labelledby="rdTitle"><div class="sec-h"><h2 id="rdTitle">The read</h2></div><div class="read" id="read"></div>
      <p class="legal">Cash, burn and v1 runway are Investair's data. The range and item estimates are AI-assessed from company announcements and are drafts for professional review, not company guidance or financial advice.</p></section>`;
  renderChart(c); renderMoves(c); renderRead(c);
  if (!c._ex) {
    $("upd").onclick = () => run(() => updateNumbers(c.ticker));
    $("reread").onclick = () => run(() => analyse(c.ticker));
    $("rm").onclick = () => { if (busy) return; const b = $("rm"); if (b.dataset.sure) { removeCompany(c.ticker).then(() => status(`${c.ticker} removed.`)); } else { b.dataset.sure = 1; b.textContent = "Select again to remove"; } };
  }
}

/* ---------- actions ---------- */
const ERR = {
  needs_reauth: "Your Investair connection needs signing in again (Settings, Connectors), then try again.",
  server_not_connected: "Investair isn't connected to your account. Add it in Settings, Connectors, then try again.",
  server_not_found: "Investair isn't connected to your account. Add it in Settings, Connectors, then try again.",
  not_in_manifest: "This page wasn't allowed to use Investair. Allow it from the page's Permissions menu, then try again.",
  not_granted: "This page wasn't allowed to use Investair or Claude. Allow it when prompted, or from the page's Permissions menu.",
  rate_limited: "Too many requests just now. Wait a minute and try again.",
  server_unavailable: "Investair didn't respond. Try again in a moment.",
  invalid_json: "Claude's answer couldn't be read. Try again.",
  sampling_disabled: "Asking Claude is turned off for your account or organisation.",
  not_found: "Investair has no cashflow row for that code. Check the ASX code.",
  not_live: "That company isn't a live listing in Investair's cashflow data. Try its current code.",
  no_db: "Sign in to Claude to save your companies."
};
async function run(fn) {
  if (busy) return;
  if (!mcp || !sample) { status("This page needs Claude and your Investair connector. Open it in Claude while signed in, with Investair connected.", true); return; }
  busy = true; renderChips();
  try { await fn(); }
  catch (e) { const c = e && e.code; status(ERR[c] || ("Something went wrong (" + esc(c || (e && e.message) || "unknown") + "). Try again."), true); }
  finally { busy = false; render(); }
}
$("addBtn").onclick = () => {
  const tk = $("tk").value.trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (!tk) { status("Enter an ASX code first, for example IMM.", true); return; }
  if (companies.some(c => c.ticker === tk)) { selected = tk; render(); status(`${tk} is already on your list.`); return; }
  if (companies.length >= MAX) { status(`You're tracking ${MAX} companies. Remove one to add another.`, true); return; }
  $("tk").value = "";
  run(() => analyse(tk));
};
$("tk").addEventListener("keydown", e => { if (e.key === "Enter") $("addBtn").click(); });

render();
(async () => {
  const cl = window.claude;
  if (!cl || !cl.use) { status("Open this page in Claude to use the outlook."); return; }
  const [m, s, d, u] = await Promise.all([cl.use("mcp"), cl.use("sample"), cl.use("db"), cl.use("user")]);
  mcp = m; sample = s; db = d;
  if (db) { try { const sn = await db.collection("examples").get(); examples = sn.docs.map(x => ({ ...x.data(), _ex: true })).filter(v => v && v.snap).sort((a, b) => a.ticker < b.ticker ? -1 : 1); } catch {} }
  if (u && db) {
    try { uid = await u.id(); } catch {}
    if (uid) {
      db.collection(`data/users/${uid}/runway/items`).onSnapshot(snap => {
        companies = snap.docs.map(x => x.data()).filter(v => v && v.snap).sort((a, b) => String(a.addedAt).localeCompare(String(b.addedAt)));
        render();
      }, () => status("Couldn't load your saved companies. Reload the page.", true));
    }
  }
  render();
  if (!mcp || !sample) status("Adding companies needs Claude and your Investair connector. Open this page in Claude with Investair connected.");
  else if (!uid) status("Sign in to Claude to save your companies.");
})();
</script>
